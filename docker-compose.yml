services:
  db:
    image: postgis/postgis:16-3.4
    container_name: firms_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-firms_db}
      POSTGRES_USER: ${DB_USER:-firms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-firms_password}
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./data/hotspots_7years_clean.csv:/docker-entrypoint-initdb.d/hotspots_7years_clean.csv
      - postgres_db_data:/var/lib/postgresql/data
    networks:
      - firms_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firms_user -d firms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firms_backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-firms_user}
      DB_PASSWORD: ${DB_PASSWORD:-firms_password}
      DB_NAME: ${DB_NAME:-firms_db}
      DB_PORT: ${DB_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://firms_user:firms_password@db:5432/firms_db}
      ASYNC_DATABASE_URL: ${ASYNC_DATABASE_URL:-postgresql+asyncpg://firms_user:firms_password@db:5432/firms_db}
      MAP_KEY: ${MAP_KEY}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - firms_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - firms_net

networks:
  firms_net:
    driver: bridge

volumes:
  postgres_db_data:
    driver: local
